/* Плавное закрытие нижних окон жестом вниз (как в Авито): окно тянется за пальцем, только когда внутри нечего листать */
function sheetDrag(el,onClose){
  const sc=$('#scrim'),mob=()=>matchMedia('(max-width:899px)').matches,EZ='cubic-bezier(.2,.8,.2,1)';
  let y0=0,x0=0,ly=0,lt=0,v=0,d=0,on=false,ok=false,can=false;
  el.addEventListener('touchstart',e=>{
    ok=e.touches.length===1&&mob()&&el.classList.contains('on')&&!document.body.classList.contains('dtop')&&!e.target.closest('.wcol,.sg,textarea');on=false;v=0;d=0;can=el.scrollTop<1;   /* закрытие только жестом, начатым уже у самого верха */

  el.addEventListener('touchmove',e=>{
    if(!ok)return;
    if(e.touches.length!==1){if(on)snap();ok=false;return}
    const y=e.touches[0].clientY;
    if(!on){
      if(el.scrollTop>=1)can=false;   /* в этом жесте листали — первое доведение до верха окно не закрывает */
      if(!can)return;
      const dy=y-y0,dx=Math.abs(e.touches[0].clientX-x0);
      if(dy>6&&dy>dx){on=true;y0=y;el.style.transition='none';sc.style.transition='none'}
      else{if(dy<0)y0=y;ly=y;lt=e.timeStamp;return}
    }
    if(e.cancelable)e.preventDefault();
    d=Math.max(0,y-y0);
    const dt=e.timeStamp-lt;if(dt>0)v=(y-ly)/dt;ly=y;lt=e.timeStamp;
    el.style.transform='translateY('+d+'px)';
    {const pr=Math.min(1,d/el.offsetHeight),q=Math.min(1,Math.max(0,(pr-.6)/.4));sc.style.opacity=1-q*q*(3-2*q)}   /* блюр держится почти до конца, гаснет только в финале */
  },{passive:false});
  function snap(){
    el.style.transition='transform .3s '+EZ;el.style.transform='';sc.style.transition='opacity .3s';sc.style.opacity='';
    setTimeout(()=>{el.style.transition='';sc.style.transition=''},320);
  }
  function end(e){
    if(!ok||!on){ok=false;return}
    ok=on=false;
    if(e.type!=='touchcancel'&&(d>Math.min(160,el.offsetHeight*.3)||(v>.5&&d>30))){
      el.style.transition='transform .28s '+EZ;el.style.transform='translateY(105%)';sc.style.transition='opacity .2s ease-in .1s';sc.style.opacity='0';
      setTimeout(()=>{el.style.transition='none';onClose();el.style.transform='';sc.style.opacity='';void el.offsetWidth;el.style.transition='';sc.style.transition=''},330);
    }else snap();

  sheet(`<h3>Установка на телефон</h3><div class="card"><div class="r"><b>iPhone (Safari)</b></div><div>Нажмите «Поделиться» → «На экран „Домой“».</div></div><div class="card"><div class="r"><b>Android (Chrome)</b></div><div>Меню ⋮ → «Установить приложение» или «Добавить на главный экран».</div></div><button class="btn g" onclick="closeAll()">Понятно</button>`);
};

const accUpd=()=>{$('#accLbl').innerHTML=esc(S.name||ME.name)+'<br><small style="color:var(--tx2);font-weight:400">'+ROLE[ME.role]+'</small>'};
document.addEventListener('input',e=>{if(e.target.id==='accCus'){S.accent=e.target.value;save();applyAccent()}});
accUpd();applyTheme();if(SOUND){const n=$('.nav[data-page="people"]');if(n&&n.lastChild)n.lastChild.textContent=' Клиенты студии'}try{const sp=localStorage.getItem('crm_pg');if(matchMedia('(min-width:900px)').matches&&['cal','people','rep'].includes(sp)){page=sp;if(sp==='rep'){const d=new Date();an={per:'m',y:d.getFullYear(),m:d.getMonth()}}}}catch(e){}render();
setInterval(()=>{if(page==='cal'&&!$('#sheet').classList.contains('on'))render()},60000);
</script>
