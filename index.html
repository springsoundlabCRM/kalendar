<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Студия · Календарь</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Студия">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--bg2:#f4f4f6;--tx:#17171a;--tx2:#7b7b86;--ln:#d6d6dc;--ac:#fc0;--acx:#17171a;--rec:#4d7cff;--les:#ff7a45;--sh:0 10px 40px rgba(0,0,0,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--bg2:#1b1b1f;--tx:#f2f2f5;--tx2:#8d8d98;--ln:#36363e;--sh:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--bg2:#1b1b1f;--tx:#f2f2f5;--tx2:#8d8d98;--ln:#36363e;--sh:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--bg)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--bg2)}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:19px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{color:var(--tx2)}
.pill{background:var(--bg2);border-radius:20px;padding:8px 13px;font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto}
.chip{padding:6px 12px;border-radius:16px;background:var(--bg2);color:var(--tx2);font-size:13px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--tx);color:var(--bg)}
.strip{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;padding:0 6px 8px;border-bottom:1px solid var(--ln)}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx2);padding:2px 0}
.strip .d i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--tx);position:relative}
.strip .d.on i{background:var(--ac);color:var(--acx)}
.strip .d.td i{outline:2px solid var(--ac);outline-offset:-2px}
.strip .d.has i::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--tx2)}
.strip .d.on.has i::after{background:var(--acx)}
.strip .ar{color:var(--tx2);font-size:20px;height:36px}
#main{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.cal{display:flex;position:relative;padding-bottom:110px}
.rul{width:44px;flex:none}.rul div{height:56px;font-size:11px;color:var(--tx2);text-align:right;padding-right:6px;transform:translateY(-7px)}
.cols{flex:1;display:flex;position:relative}
.col{flex:1;position:relative;border-left:1px solid var(--ln);min-width:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px);background-size:100% 56px}
.wh{display:flex;padding-left:44px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:3}
.wh div{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--tx2);padding:6px 0;border-left:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.wh small{text-transform:uppercase;font-size:11px}.wh i{font-style:normal;font-size:18px;font-weight:600;color:var(--tx);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.wh .on small{color:var(--tx);font-weight:700}.wh .on i{background:var(--ac);color:var(--acx)}
.ev{position:absolute;left:2px;right:3px;border-radius:9px;padding:4px 7px;font-size:12px;overflow:hidden;color:#fff;border-left:4px solid rgba(0,0,0,.25);line-height:1.25}
.ev.rec{background:var(--rec)}.ev.lesson{background:var(--les)}
.ev b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev span{opacity:.92}
.ev.paid::after{content:"✓";position:absolute;right:6px;top:3px;font-weight:700}
.now{position:absolute;left:0;right:0;height:2px;background:#f33;z-index:2;pointer-events:none}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:58px;height:58px;border-radius:19px;background:var(--ac);color:var(--acx);font-size:32px;box-shadow:var(--sh);z-index:5;display:grid;place-items:center}
.pg{padding:14px 16px 40px}.pg h2{margin:4px 0 14px}
.card{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:10px}
.card .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.card .r span:first-child{color:var(--tx2)}
.big{font-size:26px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);z-index:11;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.drawer.on{transform:none}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:18px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-style:normal;font-size:20px}
.nav{display:flex;gap:12px;align-items:center;padding:13px 12px;border-radius:12px;font-weight:600;text-align:left;width:100%}
.nav.on{background:var(--bg2)}.nav:active{background:var(--bg2)}
.sp{flex:1}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:12;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:var(--sh);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 0;font-weight:600}
input,textarea{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px}
.row{display:flex;gap:10px}.row label{flex:1}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:700;font-size:16px}
.btn.g{background:var(--bg2);color:var(--tx)}.btn.d{background:var(--bg2);color:#f33}
.err{color:#f33;font-size:13px;margin:8px 0 0;min-height:1em}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.empty{color:var(--tx2);text-align:center;padding:30px 0}
.nv{display:flex}.nv .ib{width:32px;font-size:26px;line-height:1}
.chip{padding:6px 10px}#chips .seg button{padding:6px 9px;font-size:12px;flex:none}
.col{background-image:linear-gradient(var(--ln) 1px,transparent 1px);background-size:100% 56px}
.col:last-child{border-right:1px solid var(--ln)}.col.today{background-color:rgba(255,204,0,.09)}
.rul{border-right:1px solid var(--ln)}
.mh{display:grid;grid-template-columns:repeat(7,1fr);position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--ln)}
.mh div{text-align:center;font-size:11px;text-transform:uppercase;color:var(--tx2);padding:7px 0;border-left:1px solid var(--ln)}.mh div:first-child{border-left:0}
.mg{display:grid;grid-template-columns:repeat(7,1fr);min-height:calc(100% - 30px)}
.mc{border-left:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:3px;overflow:hidden;min-width:0;cursor:pointer}.mc:nth-child(7n+1){border-left:0}
.mc.o{opacity:.4}.mc i{font-style:normal;font-size:13px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-bottom:2px}.mc.td i{background:var(--ac);color:var(--acx)}
.mev{font-size:10.5px;border-radius:5px;padding:1px 4px;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mev.rec{background:var(--rec)}.mev.lesson{background:var(--les)}.more{font-size:10.5px;color:var(--tx2);padding:1px 4px}
@media (min-width:900px){
.sheet{top:0;bottom:0;left:auto;right:0;width:460px;max-width:none;max-height:none;margin:0;border-radius:24px 0 0 24px;padding:28px 28px 28px;transform:translateX(105%)}
.sheet.on{transform:none}.grab{display:none}
.drawer{width:340px;padding:28px 20px}
.top{padding-left:20px;padding-right:20px}.chips{padding:4px 20px 10px}.ev b{font-size:14px}.ev{font-size:13px}
}
.dbtn{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg2);text-align:left;font-size:16px}
.dp{margin-top:8px;background:var(--bg2);border-radius:16px;padding:10px;border:1px solid var(--ln)}
.dph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.dph b{text-transform:capitalize;font-size:16px}.dph button{width:38px;height:38px;border-radius:10px;font-size:24px;line-height:1}.dph button:active{background:var(--ln)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.dpg small{color:var(--tx2);font-size:11px;text-transform:uppercase;padding:4px 0}
.dpg button{height:40px;border-radius:50%;font-size:15px}.dpg button:active{background:var(--ln)}.dpg .tdy{outline:2px solid var(--ac);outline-offset:-2px}.dpg .sel{background:var(--ac);color:var(--acx);font-weight:700}
.dbtn{display:flex;justify-content:space-between;align-items:center;color:var(--tx)}.dbtn svg{color:var(--tx2)}
.dpop{z-index:30;display:grid;place-items:center}
.dpop .dp{margin:0;width:min(92vw,340px);background:var(--bg);box-shadow:var(--sh);padding:14px;transform:scale(.96);transition:transform .2s}.dpop.on .dp{transform:none}
textarea{resize:vertical;max-width:100%;min-height:64px;display:block}
.sheet{overflow-x:hidden}
.dpin{max-height:0;overflow:hidden;transition:max-height .28s ease,margin .28s ease,padding .28s ease;background:var(--bg2);border-radius:16px;padding:0 10px;margin-top:0;border:1px solid transparent}
.dpin.open{max-height:380px;margin-top:8px;padding:10px;border-color:var(--ln)}
@media (max-width:899px){.dpin{display:none}}
.dpg button{width:40px;height:40px;justify-self:center;border-radius:50%}
.drawer,.sheet{box-shadow:none}.drawer.on,.sheet.on{box-shadow:var(--sh)}
.cal{padding-top:8px}
.row>div{flex:1;min-width:0}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px}
.wcol{width:84px;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wv{height:44px;line-height:44px;text-align:center;font-size:22px;scroll-snap-align:center;color:var(--tx2);cursor:pointer;font-variant-numeric:tabular-nums}.wv.on{color:var(--tx);font-weight:700}
.wsep{font-size:24px}.wband{position:absolute;left:8%;right:8%;top:88px;height:44px;border-radius:12px;background:rgba(255,204,0,.28);pointer-events:none}
.dpin:not(.open){background:none;border-width:0}
</style>
</head>
<body>
<header class="top">
  <button class="ib" id="menuBtn" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <div class="ttl"><b id="title"></b><small id="sub"></small></div>
  <button class="pill" id="todayBtn">Сегодня</button>
  <div class="nv" id="nv"><button class="ib" data-nav2="-1" aria-label="Назад">‹</button><button class="ib" data-nav2="1" aria-label="Вперёд">›</button></div>
</header>
<div class="chips" id="chips"></div>
<div class="strip" id="strip"></div>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="logo"><i>♪</i>Студия</div>
  <button class="nav" data-page="cal">📅 Календарь</button>
  <button class="nav" data-page="people">👥 Преподаватели и клиенты</button>
  <button class="nav" data-page="rep">📊 Загрузка за месяц</button>
  <button class="nav" data-page="set">⚙️ Настройки</button>
  <div class="sp"></div>
  <button class="nav" id="instBtn">📲 Установить на экран «Домой»</button>
  <label>Тема</label>
  <div class="seg" id="themeSeg"><button data-t="light">Светлая</button><button data-t="auto">Авто</button><button data-t="dark">Тёмная</button></div>
</aside>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="scrim dpop" id="dpop"><div class="dp" id="dp"></div></div>
<div class="scrim dpop" id="tpop"><div class="dp"><div id="tpw"></div></div></div>

<script>
const K='studio-crm-v1';
let S={ev:[],rate:{rec:3000,lesson:1500},theme:'auto'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const DN=['пн','вт','ср','чт','пт','сб','вс'];
const T={rec:{n:'Запись песни',who:'Клиент / исполнитель'},lesson:{n:'Урок вокала',who:'Преподаватель'}};
const cost=e=>e.rate*(e.end-e.start)/60;
const H=56,S0=8;
let cur=new Date(),view='week',filt='all',page='cal',first=true;

function applyTheme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('meta[name=theme-color]').content=dark?'#111113':'#ffffff';
  $$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme))}
const weekStart=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const evOn=d=>S.ev.filter(e=>e.date===iso(d)&&(filt==='all'||e.type===filt)).sort((a,b)=>a.start-b.start);

function render(){
  const cal=page==='cal';
  $('#chips').style.display=$('#nv').style.display=$('#todayBtn').style.display=cal?'':'none';$('#strip').style.display=cal&&view==='day'?'':'none';
  $$('.nav[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===page));
  if(!cal){const t={people:'Люди',rep:'Загрузка',set:'Настройки'}[page];$('#title').textContent=t;$('#sub').textContent='';pages();return}
  $('#title').textContent=MN[cur.getMonth()]+' '+cur.getFullYear();
  $('#sub').textContent=view==='day'?cur.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):view==='week'?(()=>{const a=weekStart(cur),b=addD(a,6),o={day:'numeric',month:'long'};return a.getMonth()===b.getMonth()?a.getDate()+' – '+b.toLocaleDateString('ru-RU',o):a.toLocaleDateString('ru-RU',o)+' – '+b.toLocaleDateString('ru-RU',o)})():'Месяц';
  
  $('#chips').innerHTML=[['all','Все'],['rec','Запись'],['lesson','Уроки']].map(([k,n])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${n}</button>`).join('')+'<div class="seg" style="margin-left:auto;flex:none">'+[['day','День'],['week','Неделя'],['month','Месяц']].map(([k,n])=>`<button class="${view===k?'on':''}" data-view="${k}">${n}</button>`).join('')+'</div>';
  const ws=weekStart(cur),td=iso(new Date());
  $('#strip').innerHTML='<button class="ar" data-nav="-7">‹</button>'+[...Array(7)].map((_,i)=>{const d=addD(ws,i);return `<button class="d ${iso(d)===iso(cur)?'on':''} ${iso(d)===td?'td':''} ${evOn(d).length?'has':''}" data-d="${iso(d)}">${DN[i]}<i>${d.getDate()}</i></button>`}).join('')+'<button class="ar" data-nav="7">›</button>';
  const days=view==='day'?[cur]:[...Array(7)].map((_,i)=>addD(ws,i));
  const rul=[...Array(24-S0)].map((_,i)=>`<div>${pad(S0+i)}:00</div>`).join('');
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const cols=days.map(d=>{const items=evOn(d).map(e=>`<div class="ev ${e.type}" data-id="${e.id}" style="top:${(e.start-S0*60)/60*H}px;height:${Math.max((e.end-e.start)/60*H-2,22)}px"><b>${esc(e.person)}</b><span>${hm(e.start)}–${hm(e.end)}</span></div>`).join('');
    const nl=iso(d)===td&&nowM>=S0*60?`<div class="now" style="top:${(nowM-S0*60)/60*H}px"></div>`:'';
    return `<div class="col${iso(d)===td?' today':''}" data-date="${iso(d)}">${items}${nl}</div>`}).join('');
  const wh='<div class="wh">'+days.map(d=>`<div class="${iso(d)===td?'on':''}" data-go="${iso(d)}"><small>${DN[(d.getDay()+6)%7]}</small><i>${d.getDate()}</i></div>`).join('')+'</div>';
  if(view==='month'){monthView();return}
  const st=$('#main').scrollTop;
  $('#main').innerHTML=wh+`<div class="cal"><div class="rul">${rul}</div><div class="cols">${cols}</div></div>`;
  $('#main').scrollTop=first?Math.max(0,((Math.min(Math.max(nowM,9*60),20*60))-S0*60-60)/60*H):st;first=false;
}
function monthView(){
  const y=cur.getFullYear(),m=cur.getMonth(),td=iso(new Date());
  const f=new Date(y,m,1),off=(f.getDay()+6)%7,s=addD(f,-off),n=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7;
  let h='<div class="mh">'+DN.map(d=>`<div>${d}</div>`).join('')+'</div><div class="mg" style="grid-template-rows:repeat('+n/7+',minmax(92px,1fr))">';
  for(let i=0;i<n;i++){const d=addD(s,i),L=evOn(d);
    h+=`<div class="mc${d.getMonth()!==m?' o':''}${iso(d)===td?' td':''}" data-date="${iso(d)}"><i>${d.getDate()}</i>`+L.slice(0,3).map(e=>`<div class="mev ${e.type}" data-id="${e.id}">${esc(e.person)}</div>`).join('')+(L.length>3?`<div class="more">ещё ${L.length-3}</div>`:'')+'</div>'}
  $('#main').innerHTML=h+'</div>';
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pages(){
  let h='<div class="pg">';
  if(page==='people'){
    const m={};S.ev.forEach(e=>{const k=e.type+'|'+e.person;(m[k]=m[k]||{type:e.type,person:e.person,n:0,h:0});const o=m[k];o.n++;o.h+=(e.end-e.start)/60});
    const L=Object.values(m).sort((a,b)=>b.h-a.h);
    h+='<h2>Преподаватели и клиенты</h2>'+(L.length?L.map(o=>`<div class="card"><div class="r"><b>${esc(o.person)}</b><span class="badge" style="background:var(--${o.type})">${T[o.type].n}</span></div><div class="r"><span>Занятий / часов</span><span>${o.n} / ${+o.h.toFixed(2)}</span></div></div>`).join(''):'<div class="empty">Пока нет записей</div>');
  }else if(page==='rep'){
    const mo=cur.getFullYear()+'-'+pad(cur.getMonth()+1),L=S.ev.filter(e=>e.date.startsWith(mo));
    const hrs=f=>L.filter(f).reduce((a,e)=>a+(e.end-e.start)/60,0);
    h+=`<h2 style="text-transform:capitalize">${MN[cur.getMonth()]} ${cur.getFullYear()}</h2>
    <div class="card"><div class="r"><span>Занято часов</span></div><div class="big">${+hrs(()=>1).toFixed(2)} ч</div><div class="r"><span>Всего занятий</span><span>${L.length}</span></div></div>
    <div class="card"><div class="r"><b>Записи песен</b><span>${+hrs(e=>e.type==='rec').toFixed(2)} ч</span></div><div class="r"><span>Занятий</span><span>${L.filter(e=>e.type==='rec').length}</span></div></div>
    <div class="card"><div class="r"><b>Уроки вокала</b><span>${+hrs(e=>e.type==='lesson').toFixed(2)} ч</span></div><div class="r"><span>Занятий</span><span>${L.filter(e=>e.type==='lesson').length}</span></div></div>
    
    <p style="color:var(--tx2);font-size:13px">Месяц выбирается в календаре.</p>`;
  }else{
    h+=`<h2>Настройки</h2>
    <button class="btn g" id="exp">Скачать резервную копию (JSON)</button><button class="btn d" id="clr">Удалить все данные</button>
    <p style="color:var(--tx2);font-size:13px">Данные хранятся на этом устройстве.</p>`;
  }
  $('#main').innerHTML=h+'</div>';
}

/* sheet / drawer */
const sheet=html=>{$('#sheetBody').innerHTML=html;$('#sheet').classList.add('on');$('#scrim').classList.add('on')};
const closeAll=()=>{$('#sheet').classList.remove('on');$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')};
const openDrawer=()=>{$('#drawer').classList.add('on');$('#scrim').classList.add('on')};

function detail(id){
  const e=S.ev.find(x=>x.id===id);if(!e)return;
  sheet(`<h3>${esc(e.person)}</h3><span class="badge" style="background:var(--${e.type})">${T[e.type].n}</span>
  <div class="card" style="margin-top:12px"><div class="r"><span>Дата</span><span>${pd(e.date).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}</span></div><div class="r"><span>Время</span><span>${hm(e.start)}–${hm(e.end)}</span></div>${e.note?`<div class="r"><span>Заметка</span><span>${esc(e.note)}</span></div>`:''}</div>
  <button class="btn" data-edit="${id}">Изменить</button><button class="btn d" data-del="${id}">Удалить</button>`);
}
function form(id,pre){
  const e=S.ev.find(x=>x.id===id)||Object.assign({type:'lesson',person:'',date:iso(cur),start:10*60,end:11*60,note:''},pre||{});
  let type=e.type,dval=e.date,dm=pd(e.date);const desk=matchMedia('(min-width:900px)').matches;let ts=e.start,te=e.end,tact=null;
  sheet(`<h3>${id?'Изменить':'Новая запись'}</h3>
  <div class="seg" id="fType"><button data-v="lesson">Урок вокала</button><button data-v="rec">Запись песни</button></div>
  <label id="fWho"></label><input id="fPerson" value="${esc(e.person)}" placeholder="Имя">
  <label>Дата</label><button type="button" class="dbtn" id="fDateBtn"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><div class="dpin" id="dpin"></div>
  <div class="row"><div><label>Начало</label><button type="button" class="dbtn" id="fS"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div><div><label>Конец</label><button type="button" class="dbtn" id="fE"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div></div><div class="dpin" id="tpin"></div>
  
  <label>Заметка (ученик, трек и т.д.)</label><textarea id="fNote" rows="2">${esc(e.note)}</textarea>
  <p class="err" id="fErr"></p><button class="btn" id="fSave">Сохранить</button>`);
  const sync=()=>{$$('#fType button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));$('#fWho').textContent=T[type].who};sync();
  $('#fType').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;type=b.dataset.v;sync()};
  const showD=()=>{$('#fDateBtn span').textContent=pd(dval).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
  const drawDp=()=>{const y=dm.getFullYear(),m=dm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),td=iso(new Date());
    let h=`<div class="dph"><button type="button" data-dm="-1">‹</button><b>${MN[m]} ${y}</b><button type="button" data-dm="1">›</button></div><div class="dpg">`+DN.map(d=>`<small>${d}</small>`).join('');
    for(let i=0;i<off;i++)h+='<span></span>';
    for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);h+=`<button type="button" class="${k===dval?'sel':''} ${k===td?'tdy':''}" data-dd="${k}">${d}</button>`}
    (desk?$('#dpin'):$('#dp')).innerHTML=h+'</div>'};
  showD();
  $('#fDateBtn').onclick=()=>{closeT();if(desk){const p=$('#dpin');if(p.classList.contains('open'))return p.classList.remove('open');dm=pd(dval);drawDp();return p.classList.add('open')}dm=pd(dval);drawDp();$('#dpop').classList.add('on')};
  $('#dp').onclick=$('#dpin').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.dm){dm=new Date(dm.getFullYear(),dm.getMonth()+(+b.dataset.dm),1);drawDp()}
    else if(b.dataset.dd){dval=b.dataset.dd;showD();$('#dpop').classList.remove('on');$('#dpin').classList.remove('open')}};
  const showT=()=>{$('#fS span').textContent=hm(ts);$('#fE span').textContent=hm(te)};showT();
  const mark=c=>{const i=Math.round(c.scrollTop/44);[...c.children].forEach((x,j)=>x.classList.toggle('on',j===i))};
  const closeT=()=>{$('#tpop').classList.remove('on');$('#tpin').classList.remove('open');tact=null};
  const buildW=el=>{
    const v=tact==='s'?ts:te,hi=Math.floor(v/60),mi=Math.round((v%60)/5)%12;
    const it=a=>a.map(x=>`<div class="wv">${pad(x)}</div>`).join('');
    el.innerHTML=`<div class="wheel"><div class="wcol">${it([...Array(24).keys()])}</div><b class="wsep">:</b><div class="wcol">${it([...Array(12).keys()].map(i=>i*5))}</div><div class="wband"></div></div><button type="button" class="btn" data-tdone="1">Готово</button>`;
    const [ch,cm]=el.querySelectorAll('.wcol');let lock=true;
    ch.scrollTop=hi*44;cm.scrollTop=mi*44;mark(ch);mark(cm);setTimeout(()=>lock=false,300);
    [ch,cm].forEach(c=>c.addEventListener('wheel',ev=>{ev.preventDefault();c._a=(c._a||0)+ev.deltaY*(ev.deltaMode===1?33:1);if(Math.abs(c._a)<30)return;const st=Math.sign(c._a);c._a=0;const n=c.children.length-1,base=Date.now()-(c._wt||0)<400?c._i:Math.round(c.scrollTop/44);c._i=Math.max(0,Math.min(n,base+st));c._wt=Date.now();c.scrollTo({top:c._i*44,behavior:'smooth'})},{passive:false}));
    [ch,cm].forEach(c=>c.onscroll=()=>{mark(c);if(lock)return;clearTimeout(c._t);c._t=setTimeout(()=>{
      const nv=Math.round(ch.scrollTop/44)*60+Math.round(cm.scrollTop/44)*5;
      if(tact==='s'){const d=te-ts;ts=nv;te=Math.min(ts+d,1439)}else te=nv;showT()},100)});
  };
  const openT=k=>{
    if(desk){$('#dpin').classList.remove('open');const p=$('#tpin');if(p.classList.contains('open')&&tact===k)return closeT();tact=k;buildW(p);p.classList.add('open')}
    else{tact=k;buildW($('#tpw'));$('#tpop').classList.add('on')}
  };
  const tclick=ev=>{const w=ev.target.closest('.wv');if(w){const c=w.parentNode;c.scrollTo({top:[...c.children].indexOf(w)*44,behavior:'smooth'});return}if(ev.target.closest('[data-tdone]'))closeT()};
  $('#tpin').onclick=$('#tpw').onclick=tclick;
  $('#tpop').onclick=ev=>{if(ev.target.id==='tpop')closeT()};
  $('#fS').onclick=()=>openT('s');$('#fE').onclick=()=>openT('e');
  $('#fSave').onclick=()=>{
    const n={id:id||String(Date.now()),type,person:$('#fPerson').value.trim(),date:dval,start:ts,end:te,note:$('#fNote').value.trim()};
    const er=t=>$('#fErr').textContent=t;
    if(!n.person)return er('Укажите имя');if(!n.date)return er('Укажите дату');if(n.end<=n.start)return er('Конец должен быть позже начала');
    const c=S.ev.find(x=>x.id!==n.id&&x.date===n.date&&x.start<n.end&&n.start<x.end);
    if(c)return er(`Студия занята: ${c.person}, ${hm(c.start)}–${hm(c.end)}`);
    S.ev=S.ev.filter(x=>x.id!==n.id);S.ev.push(n);save();cur=pd(n.date);closeAll();render();
  };
}

/* events */
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  let b;
  if(b=q('.ev,.mev'))return detail(b.dataset.id);
  if(b=q('[data-view]')){view=b.dataset.view;first=true;return render()}
  if(b=q('[data-nav2]')){const s=+b.dataset.nav2;cur=view==='month'?new Date(cur.getFullYear(),cur.getMonth()+s,1):addD(cur,s*(view==='week'?7:1));return render()}
  if(b=q('[data-go]')){cur=pd(b.dataset.go);view='day';first=true;return render()}
  if(b=q('.mc')){cur=pd(b.dataset.date);view='day';first=true;return render()}
  if(b=q('[data-pay]')){const x=S.ev.find(v=>v.id===b.dataset.pay);x.paid=!x.paid;save();closeAll();render();return}
  if(b=q('[data-edit]'))return form(b.dataset.edit);
  if(b=q('[data-del]')){if(confirm('Удалить запись?')){S.ev=S.ev.filter(v=>v.id!==b.dataset.del);save();closeAll();render()}return}
  if(b=q('[data-d]')){cur=pd(b.dataset.d);return render()}
  if(b=q('[data-nav]')){cur=addD(cur,+b.dataset.nav);return render()}
  if(b=q('[data-f]')){filt=b.dataset.f;return render()}
  if(b=q('[data-page]')){page=b.dataset.page;closeAll();return render()}
  if(b=q('#themeSeg button')){S.theme=b.dataset.t;save();return applyTheme()}
  if(b=q('.col')){const r=b.getBoundingClientRect(),m=Math.floor((e.clientY-r.top)/H*4)/4*60+S0*60;return form(null,{date:b.dataset.date,start:m,end:m+60})}
  if(q('#saveSet')){S.rate={rec:+$('#r1').value||0,lesson:+$('#r2').value||0};save();return alert('Сохранено')}
  if(q('#exp')){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='studio-backup.json';a.click();return}
  if(q('#clr')){if(confirm('Удалить все записи?')){S.ev=[];save();render()}return}
});
$('#menuBtn').onclick=openDrawer;$('#scrim').onclick=closeAll;$('#dpop').onclick=e=>{if(e.target.id==='dpop')$('#dpop').classList.remove('on')};

$('#todayBtn').onclick=()=>{cur=new Date();render()};


/* swipes */
let sx,sy,edge=false,inDrawer=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;edge=sx<22;inDrawer=!!e.target.closest('#drawer')},{passive:true});
document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*.7)return;
  if(edge&&dx>0)return openDrawer();
  if(inDrawer&&dx<0)return closeAll();
  if(dx>0&&$('#sheet').classList.contains('on'))return;
  if(page==='cal'&&e.target.closest('#main,#strip')&&!$('#drawer').classList.contains('on')&&!$('#sheet').classList.contains('on')){cur=addD(cur,(dx<0?1:-1)*(view==='week'?7:1));render()}
},{passive:true});
let sy2;$('#sheet').addEventListener('touchstart',e=>sy2=e.touches[0].clientY,{passive:true});
$('#sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy2>90&&$('#sheet').scrollTop===0)closeAll()},{passive:true});

/* PWA: icon, manifest, install */
(function(){
  const mk=sz=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');x.fillStyle='#ffcc00';x.fillRect(0,0,sz,sz);x.fillStyle='#17171a';x.font='bold '+sz*.6+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('♪',sz/2,sz*.54);return c.toDataURL('image/png')};
  try{
    const i=mk(180),l=document.createElement('link');l.rel='apple-touch-icon';l.href=i;document.head.appendChild(l);
    const m={name:'Студия — календарь',short_name:'Студия',display:'standalone',start_url:location.href,background_color:'#ffffff',theme_color:'#ffcc00',icons:[{src:mk(192),sizes:'192x192',type:'image/png'},{src:mk(512),sizes:'512x512',type:'image/png'}]};
    const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k);
  }catch(e){}
})();
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
$('#instBtn').onclick=async()=>{
  if(dp){dp.prompt();dp=null;closeAll();return}
  closeAll();
  sheet(`<h3>Установка на телефон</h3><div class="card"><div class="r"><b>iPhone (Safari)</b></div><div>Нажмите «Поделиться» → «На экран „Домой“».</div></div><div class="card"><div class="r"><b>Android (Chrome)</b></div><div>Меню ⋮ → «Установить приложение» или «Добавить на главный экран».</div></div><button class="btn g" onclick="closeAll()">Понятно</button>`);
};

applyTheme();render();
setInterval(()=>{if(page==='cal'&&!$('#sheet').classList.contains('on'))render()},60000);
</script>
