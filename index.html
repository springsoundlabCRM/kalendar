<style>

label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 0;font-weight:600}

.row{display:flex;gap:10px}.row label{flex:1}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:700;font-size:16px}
.btn.g{background:var(--bg2);color:var(--tx)}.btn.d{background:var(--bg2);color:#f33}

.nv{display:flex}.nv .ib{width:32px;font-size:26px;line-height:1}
.chip{padding:6px 10px}#chips .seg button{padding:6px 9px;font-size:12px;flex:none}
.col{background-image:linear-gradient(var(--ln) 1px,transparent 1px);background-size:100% var(--h,56px)}

.rul{border-right:1px solid var(--ln)}

.mc{border-left:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:3px;overflow:hidden;min-width:0;cursor:pointer}.mc:nth-child(7n+1){border-left:0}

.mev{font-size:10.5px;border-radius:5px;padding:1px 4px;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mev.rec{background:var(--rec)}.mev.lesson{background:var(--les)}.more{font-size:10.5px;color:var(--tx2);padding:1px 4px}

}

.cal{padding-top:8px}
.row>div{flex:1;min-width:0}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px}

body{padding-left:min(82vw,280px)}
.drawer{transform:none!important;z-index:9}.drawer,.drawer.on{box-shadow:none;border-right:1px solid var(--ln)}

}

<header class="top">

    <button class="ib" id="vbtn" aria-label="Масштаб календаря"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <div class="vmenu" id="vmenu"><button data-vm="1">1 день</button><button data-vm="3">3 дня</button><button data-vm="5">5 дней</button><button data-vm="7">7 дней</button><button data-vm="m">Месяц</button></div>
  </div>

<aside class="drawer" id="drawer">
  <div class="logo"><i>♪</i>Студия</div>
  <button class="nav" data-page="cal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".6" fill="currentColor"/></svg> Календарь</button>
  <button class="nav" data-page="people"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.8.2 4.5 2 4.5 5"/></svg> Ученики</button>
  <button class="nav" data-page="rep"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg> Аналитика</button>
  <button class="nav" data-page="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg> Настройки</button>
  <div class="sp"></div>
  <div class="acc"><i class="av"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></i><span id="accLbl"></span></div>
</aside>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="scrim dpop" id="dpop"><div class="dp" id="dp"></div></div>
<div class="scrim dpop" id="tpop"><div class="dp"><div id="tpw"></div></div></div>

<script>
const K='studio-crm-v1';
let S={ev:[],rate:{rec:3000,lesson:1500},theme:'auto'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
S.stu=S.stu||[];S.subs=S.subs||[];let stuQv='',stuK='';
const key=n=>String(n||'').trim().toLowerCase();
const allStu=()=>{const m=new Map();S.stu.forEach(s=>m.set(key(s.name),s.name));S.ev.forEach(e=>{const k=key(e.person);if(k&&!m.has(k))m.set(k,e.person.trim())});return[...m]};
function stat(k,ex){const hr=e=>(e.end-e.start)/60,ev=S.ev.filter(e=>key(e.person)===k),su=S.subs.filter(x=>x.k===k),total=su.reduce((a,x)=>a+x.total,0),used=ev.filter(e=>e.pay==='sub'&&e.id!==ex).length;
  return{ev,su,total,left:total-used,n:ev.length,h:ev.reduce((a,e)=>a+hr(e),0),paid:su.reduce((a,x)=>a+x.price,0)+ev.filter(e=>e.pay!=='sub').reduce((a,e)=>a+hr(e)*(+S.rate[e.type]||0),0),last:ev.reduce((a,e)=>e.date>a?e.date:a,'')}}
const subCell=o=>o.total?(o.left>0?`<div class="pb"><i style="width:${o.left/o.total*100}%"></i></div><small>Осталось ${o.left} из ${o.total}</small>`:'<small>Абонемент закончился</small>'):'<small>Нет абонемента</small>';
const dshort=d=>pd(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
function stuRows(){const q=key(stuQv),R=allStu().filter(([k])=>k.includes(q)).map(([k,nm])=>({k,nm,...stat(k)})).sort((a,b)=>(b.last>a.last)-(b.last<a.last)||a.nm.localeCompare(b.nm));
  return R.length?R.map(o=>`<div class="srow" data-stu="${esc(o.k)}"><div class="sn"><i class="sa">${esc(o.nm[0].toUpperCase())}</i><b>${esc(o.nm)}</b></div><span>${o.n}</span><div>${subCell(o)}</div><span>${rub(o.paid)}</span><span>${o.last?dshort(o.last):'—'}</span></div>`).join(''):'<div class="empty" style="padding:24px">Нет учеников</div>'}
const XB='<button class="xbtn" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>';
function stuHtml(){const k=stuK,nm=(allStu().find(a=>a[0]===k)||[k,k])[1],o=stat(k),kp=(t,v)=>`<div class="card" style="margin:0"><small style="color:var(--tx2)">${t}</small><div class="big">${v}</div></div>`;
  return XB+`<h3>${esc(nm)}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">${kp('Занятий',o.n)}${kp('Часов',+o.h.toFixed(1))}${kp('Оплачено',rub(o.paid))}${kp('В абонементе',o.total?o.left+' из '+o.total:'—')}</div>
  <div class="card"><b>Абонементы</b>${o.su.map(x=>`<div class="r"><span>${dshort(x.date)} · ${x.total} × ${rub(x.unit||(x.price/x.total))}</span><span>${rub(x.price)}</span></div>`).join('')||'<div class="r"><span>Пока нет</span></div>'}<div class="row" style="margin-top:10px"><input id="subN" type="number" min="1" placeholder="Занятий" style="margin:0"><input id="subP" type="number" min="0" placeholder="Цена за занятие, ₽" style="margin:0"></div><div class="r" style="margin-top:10px"><span>Итого</span><b id="subT">0 ₽</b></div><button class="btn" data-addsub style="margin:10px 0 0">Добавить абонемент</button></div>
  <div class="card"><b>История</b>${o.ev.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(e=>`<div class="r"><span>${dshort(e.date)} · ${T[e.type].n}</span><span>${e.pay==='sub'?'Абонемент':'Наличные'}</span></div>`).join('')||'<div class="r"><span>Пока нет занятий</span></div>'}</div>`}
document.addEventListener('input',e=>{if(e.target.id==='subN'||e.target.id==='subP')$('#subT').textContent=rub((+$('#subN').value||0)*(+$('#subP').value||0));if(e.target.id==='stuQ'){stuQv=e.target.value;$('#stuList').innerHTML=stuRows()}});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const DN=['пн','вт','ср','чт','пт','сб','вс'];
const T={rec:{n:'Запись песни',who:'Клиент / исполнитель'},lesson:{n:'Урок вокала',who:'Ученик'}};
const cost=e=>e.rate*(e.end-e.start)/60;
const S0=8;let H=Math.min(140,Math.max(28,+S.zoom||56));document.documentElement.style.setProperty('--h',H+'px');
let nd=7,cur=new Date(),view='week',filt='all',page='cal',first=true;

function applyTheme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('meta[name=theme-color]').content=dark?'#111113':'#ffffff';
  $$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme))}
const weekStart=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const evOn=d=>S.ev.filter(e=>e.date===iso(d)&&(filt==='all'||e.type===filt)).sort((a,b)=>a.start-b.start);

function render(){
  const cal=page==='cal';document.body.dataset.pg=page;
  $('#nv').style.display=$('#todayBtn').style.display=$('#vw').style.display=cal?'':'none';$('#zm').style.display=cal&&view!=='month'?'':'none';$('#strip').style.display=cal&&view==='day'?'':'none';$('#pgClose').style.display=cal?'none':'';
  $$('.nav[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===page));
  if(!cal){const t={people:'Ученики',rep:'Загрузка',set:'Настройки'}[page];$('#title').textContent=t;$('#sub').textContent='';pages();return}
  $('#title').textContent=MN[cur.getMonth()];
  $('#sub').textContent=view==='day'?cur.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):view==='week'?(()=>{const a=nd===7?weekStart(cur):cur,b=addD(a,nd-1),o={day:'numeric',month:'long'};return a.getMonth()===b.getMonth()?a.getDate()+' – '+b.toLocaleDateString('ru-RU',o):a.toLocaleDateString('ru-RU',o)+' – '+b.toLocaleDateString('ru-RU',o)})():'Месяц';
  
  $$('#vmenu button').forEach(b=>b.classList.toggle('on',view==='month'?b.dataset.vm==='m':+b.dataset.vm===nd));
  const ws=weekStart(cur),td=iso(new Date());
  $('#strip').innerHTML='<button class="ar" data-nav="-7">‹</button>'+[...Array(7)].map((_,i)=>{const d=addD(ws,i);return `<button class="d ${iso(d)===iso(cur)?'on':''} ${iso(d)===td?'td':''} ${evOn(d).length?'has':''}" data-d="${iso(d)}">${DN[i]}<i>${d.getDate()}</i></button>`}).join('')+'<button class="ar" data-nav="7">›</button>';
  const days=view==='day'?[cur]:[...Array(nd)].map((_,i)=>addD(nd===7?ws:cur,i));
  const rul=[...Array(24-S0)].map((_,i)=>`<div>${pad(S0+i)}:00</div>`).join('');
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const cols=days.map(d=>{const items=evOn(d).map(e=>`<div class="ev ${e.type}" data-id="${e.id}" style="top:${(e.start-S0*60)/60*H}px;height:${Math.max((e.end-e.start)/60*H-2,22)}px"><b>${esc(e.person)}</b><span>${hm(e.start)}–${hm(e.end)}</span></div>`).join('');
    const nl=iso(d)===td&&nowM>=S0*60?`<div class="now" style="top:${(nowM-S0*60)/60*H}px"></div>`:'';
    return `<div class="col${iso(d)===td?' today':''}" data-date="${iso(d)}">${items}${nl}</div>`}).join('');
  const wh='<div class="wh">'+days.map(d=>`<div class="${iso(d)===td?'on':''}" data-go="${iso(d)}"><small>${DN[(d.getDay()+6)%7]}</small><i>${d.getDate()}</i></div>`).join('')+'</div>';
  if(view==='month'){monthView();return}
  const st=$('#main').scrollTop;
  $('#main').innerHTML=wh+`<div class="cal"><div class="rul">${rul}</div><div class="cols">${cols}</div></div>`;
  $('#main').scrollTop=first?Math.max(0,((Math.min(Math.max(nowM,9*60),20*60))-S0*60-60)/60*H):st;first=false;
}
function monthView(){
  const y=cur.getFullYear(),m=cur.getMonth(),td=iso(new Date());
  const f=new Date(y,m,1),off=(f.getDay()+6)%7,s=addD(f,-off),n=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7;
  let h='<div class="mh">'+DN.map(d=>`<div>${d}</div>`).join('')+'</div><div class="mg" style="grid-template-rows:repeat('+n/7+',minmax(92px,1fr))">';
  for(let i=0;i<n;i++){const d=addD(s,i),L=evOn(d);
    h+=`<div class="mc${d.getMonth()!==m?' o':''}${iso(d)===td?' td':''}" data-date="${iso(d)}"><i>${d.getDate()}</i>`+L.slice(0,3).map(e=>`<div class="mev ${e.type}" data-id="${e.id}">${esc(e.person)}</div>`).join('')+(L.length>3?`<div class="more">ещё ${L.length-3}</div>`:'')+'</div>'}
  $('#main').innerHTML=h+'</div>';
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pages(){
  let h='<div class="pg">';
  if(page==='people'){
    h+=`<div class="sth" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px"><h2 style="margin:0">Ученики</h2><button class="btn" data-addstu style="width:auto;margin:0;padding:10px 16px">+ Ученик</button></div><input id="stuQ" placeholder="Поиск ученика" value="${esc(stuQv)}" style="margin:0 0 12px"><div class="stbl"><div class="srow h"><span>Ученик</span><span>Занятий</span><span>Абонемент</span><span>Оплачено</span><span>Последнее</span></div><div id="stuList">${stuRows()}</div></div>`;
  }
  $('#main').innerHTML=h+'</div>';
}

/* sheet / drawer */
let an={per:'m',y:0,m:0};
function anHtml(){
  const rt=e=>+(S.rate&&S.rate[e.type])||0,hr=e=>(e.end-e.start)/60;
  const Y=an.y,M=an.m,mk=Y+'-'+pad(M+1);
  const inP=e=>an.per==='all'||(an.per==='y'?e.date.startsWith(Y+'-'):e.date.startsWith(mk));
  const L=S.ev.filter(inP);
  const sum=(a,f)=>a.reduce((t,e)=>t+f(e),0),H=n=>(+n.toFixed(1)).toLocaleString('ru-RU')+' ч';
  const hrs=sum(L,hr),inc=sum(L,e=>hr(e)*rt(e)),cnt=L.length;
  const kpi=(t,v)=>`<div class="card" style="margin:0"><small style="color:var(--tx2)">${t}</small><div class="big">${v}</div></div>`;
  const bars=(v,lb,fm)=>{const mx=Math.max(...v,0)||1;return `<div class="bars">${v.map((x,k)=>`<div class="bc" title="${fm(x)}"><i style="height:${x/mx*100}%;${x?'':'opacity:.25'}"></i><small>${lb[k]}</small></div>`).join('')}</div>`};
  let chart='',ct='';
  if(an.per==='m'){const n=new Date(Y,M+1,0).getDate(),v=Array(n).fill(0);L.forEach(e=>{v[+e.date.slice(8,10)-1]+=hr(e)});chart=bars(v,v.map((_,k)=>(k+1)%5===1?k+1:''),H);ct='Часы по дням'}
  else if(an.per==='y'){const v=Array(12).fill(0);L.forEach(e=>{v[+e.date.slice(5,7)-1]+=hr(e)*rt(e)});chart=bars(v,['Я','Ф','М','А','М','И','И','А','С','О','Н','Д'],rub);ct='Доход по месяцам'}
  else{const ys=[...new Set(S.ev.map(e=>e.date.slice(0,4)))].sort(),v=ys.map(y=>sum(S.ev.filter(e=>e.date.startsWith(y)),e=>hr(e)*rt(e)));chart=ys.length?bars(v,ys.map(y=>y.slice(2)),rub):'';ct='Доход по годам'}
  const byT=['lesson','rec'].map(t=>{const a=L.filter(e=>e.type===t);return `<div class="card" style="margin:0 0 10px"><div class="r"><b>${T[t].n}</b><span>${rub(sum(a,e=>hr(e)*rt(e)))}</span></div><div class="r"><span>${a.length} занятий</span><span>${H(sum(a,hr))}</span></div></div>`}).join('');
  const pm={};L.forEach(e=>{const n=(e.person||'').trim();if(!n)return;(pm[n]=pm[n]||{c:0,h:0,m:0});pm[n].c++;pm[n].h+=hr(e);pm[n].m+=hr(e)*rt(e)});
  const top=Object.entries(pm).sort((a,b)=>b[1].m-a[1].m||b[1].h-a[1].h).slice(0,5).map(([n,o])=>`<div class="r"><span>${esc(n)} · ${o.c}</span><span>${rub(o.m)}</span></div>`).join('');
  const all=S.ev,aInc=sum(all,e=>hr(e)*rt(e)),aH=sum(all,hr);
  const ttl=an.per==='m'?MN[M]+' '+Y:an.per==='y'?String(Y):'Всё время';
  return `<button class="ib mbtn" data-menu aria-label="Меню"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="xbtn" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>`+`<h3 style="text-transform:capitalize">Аналитика</h3>
  <div class="seg" style="margin-bottom:12px"><button class="${an.per==='m'?'on':''}" data-ap="m">Месяц</button><button class="${an.per==='y'?'on':''}" data-ap="y">Год</button><button class="${an.per==='all'?'on':''}" data-ap="all">Всё время</button></div>
  <div style="display:flex;align-items:center;margin-bottom:12px"><button class="ib" data-ao="-1" aria-label="Назад" ${an.per==='all'?'style="visibility:hidden" tabindex="-1"':''}>‹</button><b style="text-transform:capitalize;flex:1;text-align:center">${ttl}</b><button class="ib" data-ao="1" aria-label="Вперёд" ${an.per==='all'?'style="visibility:hidden" tabindex="-1"':''}>›</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">${kpi('Доход',rub(inc))}${kpi('Занятий',cnt)}${kpi('Часов',H(hrs))}${kpi('Средний чек',rub(cnt?inc/cnt:0))}</div>
  ${byT}
  ${chart?`<div class="card" style="margin:0 0 10px"><small style="color:var(--tx2)">${ct}</small>${chart}</div>`:''}
  ${top?`<div class="card" style="margin:0 0 10px"><b>Топ имён</b>${top}</div>`:''}
  <div class="card" style="margin:0 0 10px"><div class="r"><b>За всё время</b><span>${rub(aInc)}</span></div><div class="r"><span>${all.length} занятий</span><span>${H(aH)}</span></div></div>
  <p style="color:var(--tx2);font-size:13px;margin:0">Доход считается по ставкам: урок ${rub(+(S.rate&&S.rate.lesson)||0)}/ч, запись ${rub(+(S.rate&&S.rate.rec)||0)}/ч.</p>`;
}
function analytics(){const d=new Date();an={per:'m',y:d.getFullYear(),m:d.getMonth()};fullNext=true;sheet(anHtml());$('#sheet').classList.add('an')}
function settings(){
  fullNext=true;
  sheet(`<button class="ib mbtn" data-menu aria-label="Меню"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="xbtn" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button><h3>Настройки</h3>
  <div class="card"><label style="margin-top:0">Имя аккаунта</label><div class="row" style="align-items:center;margin-top:5px"><input id="setName" style="margin-top:0" value="${esc(S.name)}" placeholder="Преподаватель 1" maxlength="40"><button class="btn" id="saveName" style="width:auto;flex:none;margin:0;padding:12px 18px">Сохранить</button></div></div>
  <div class="card"><label style="margin-top:0">Тема</label><div class="seg" id="themeSeg" style="margin-top:8px;background:var(--bg)"><button data-t="light">Светлая</button><button data-t="auto">Авто</button><button data-t="dark">Тёмная</button></div></div>
  <div class="card"><label style="margin-top:0">Данные</label><div class="row" style="margin-top:8px"><button class="btn g" id="exp" style="margin:0;background:var(--bg);flex:1;font-size:15px">Резервная копия</button><button class="btn d" id="clr" style="margin:0;background:var(--bg);flex:1;font-size:15px">Удалить всё</button></div><p style="color:var(--tx2);font-size:13px;margin:10px 0 0">Данные хранятся на этом устройстве.</p></div>`);
  applyTheme();
}

let tallNext=false,fullNext=false;
const sheet=html=>{const sh=$('#sheet');$('#scrim').classList.toggle('blur',fullNext);$('#sheetBody').innerHTML=html;sh.style.transition='none';sh.classList.remove('an');sh.classList.toggle('tall',tallNext);sh.classList.toggle('full',fullNext);tallNext=fullNext=false;void sh.offsetWidth;sh.style.transition='';void sh.offsetWidth;sh.classList.add('on');$('#scrim').classList.add('on')};
const closeAll=()=>{$('#scrim').classList.remove('blur');$('#sheet').classList.remove('on');$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')};
const openDrawer=()=>{$('#drawer').classList.add('on');$('#scrim').classList.add('on')};

function detail(id){
  const e=S.ev.find(x=>x.id===id);if(!e)return;
  sheet(`<h3>${esc(e.person)}</h3><span class="badge" style="background:var(--${e.type})">${T[e.type].n}</span>
  <div class="card" style="margin-top:12px"><div class="r"><span>Дата</span><span>${pd(e.date).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}</span></div><div class="r"><span>Время</span><span>${hm(e.start)}–${hm(e.end)}</span></div>${e.note?`<div class="r"><span>Заметка</span><span>${esc(e.note)}</span></div>`:''}</div>
  <button class="btn" data-edit="${id}">Изменить</button><button class="btn d" data-del="${id}">Удалить</button>`);
}
function form(id,pre){
  const e=S.ev.find(x=>x.id===id)||Object.assign({type:'lesson',person:'',date:iso(cur),start:10*60,end:11*60,note:''},pre||{});
  let type=e.type,dval=e.date,dm=pd(e.date);const desk=matchMedia('(min-width:900px)').matches;let ts=e.start,te=e.end,tact=null,bk=null;
  tallNext=true;
  sheet(`<h3>${id?'Изменить':'Новая запись'}</h3>
  <div class="seg" id="fType"><button data-v="lesson">Урок вокала</button><button data-v="rec">Запись песни</button></div>
  <label id="fWho"></label><div class="pw"><input id="fPerson" autocomplete="off" value="${esc(e.person)}" placeholder="Имя"><div class="sg" id="fSug"></div></div><label>Оплата</label><div class="seg" id="fPay"><button data-p="cash">Наличными</button><button data-p="sub">Абонемент</button></div><small id="fPayH" style="color:var(--tx2)"></small>
  <label>Дата</label><button type="button" class="dbtn" id="fDateBtn"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><div class="dpin" id="dpin"></div>
  <div class="row"><div><label>Начало</label><button type="button" class="dbtn" id="fS"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div><div><label>Конец</label><button type="button" class="dbtn" id="fE"><span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div></div><div class="dpin" id="tpin"></div>
  
  <label>Заметка (ученик, трек и т.д.)</label><textarea id="fNote" rows="2">${esc(e.note)}</textarea>
  <p class="err" id="fErr"></p><button class="btn" id="fSave">Сохранить</button>`);
  const sync=()=>{$$('#fType button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));$('#fWho').textContent=T[type].who};sync();
  let pay=e.pay||'cash',manual=!!e.pay;
  const upPay=()=>{const st=stat(key($('#fPerson').value),id);if(!manual&&!id)pay=st.left>0?'sub':'cash';$$('#fPay button').forEach(b=>b.classList.toggle('on',b.dataset.p===pay));$('#fPayH').textContent=st.total?`Осталось ${st.left} из ${st.total}`:'Абонемента нет'};
  $('#fPay').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;pay=b.dataset.p;manual=true;upPay()};const sg=$('#fSug'),setSg=o=>{sg.classList.toggle('on',o);$('#sheetBody').classList.toggle('sgo',o)},hideSg=()=>setSg(false);
  $('#fPerson').oninput=()=>{upPay();const v=key($('#fPerson').value),m=v?allStu().filter(a=>a[0].includes(v)&&a[0]!==v).slice(0,6):[];sg.innerHTML=m.map(a=>`<div data-sg="${esc(a[1])}">${esc(a[1])}</div>`).join('');setSg(m.length>0)};
  $('#fPerson').onblur=()=>setTimeout(hideSg,200);
  sg.onclick=ev=>{const d=ev.target.closest('[data-sg]');if(!d)return;$('#fPerson').value=d.dataset.sg;hideSg();upPay()};upPay();
  $('#fType').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;type=b.dataset.v;sync()};
  const showD=()=>{$('#fDateBtn span').textContent=pd(dval).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
  const drawDp=()=>{const y=dm.getFullYear(),m=dm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),td=iso(new Date());
    let h=`<div class="dph"><button type="button" data-dm="-1">‹</button><b>${MN[m]} ${y}</b><button type="button" data-dm="1">›</button></div><div class="dpg">`+DN.map(d=>`<small>${d}</small>`).join('');
    for(let i=0;i<off;i++)h+='<span></span>';
    for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);h+=`<button type="button" class="${k===dval?'sel':''} ${k===td?'tdy':''}" data-dd="${k}">${d}</button>`}
    (desk?$('#dpin'):$('#dp')).innerHTML=h+'</div>'};
  showD();
  $('#fDateBtn').onclick=()=>{closeT();if(desk){const p=$('#dpin');if(p.classList.contains('open'))return p.classList.remove('open');dm=pd(dval);drawDp();return p.classList.add('open')}dm=pd(dval);drawDp();$('#dpop').classList.add('on')};
  $('#dp').onclick=$('#dpin').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.dm){dm=new Date(dm.getFullYear(),dm.getMonth()+(+b.dataset.dm),1);drawDp()}
    else if(b.dataset.dd){dval=b.dataset.dd;showD();$('#dpop').classList.remove('on');$('#dpin').classList.remove('open')}};
  const showT=()=>{$('#fS span').textContent=hm(ts);$('#fE span').textContent=hm(te)};showT();
  const mark=c=>{const i=Math.round(c.scrollTop/44);[...c.children].forEach((x,j)=>x.classList.toggle('on',j===i))};
  const closeT=()=>{$('#tpop').classList.remove('on');$('#tpin').classList.remove('open');tact=null};
  const wrap=(c,len)=>{const i=Math.round(c.scrollTop/44);if(i>=len*2&&i<len*5)return;const ni=len*3+(i%len);c.style.scrollSnapType='none';c.scrollTop=ni*44;c._i=ni;requestAnimationFrame(()=>{c.style.scrollSnapType=''})};
  const buildW=el=>{
    const v=tact==='s'?ts:te,hi=Math.floor(v/60),mi=v%60;
    const it=a=>[1,2,3,4,5,6,7].map(()=>a.map(x=>`<div class="wv">${pad(x)}</div>`).join('')).join('');
    el.innerHTML=`<div class="wheel"><div class="wcol">${it([...Array(24).keys()])}</div><b class="wsep">:</b><div class="wcol">${it([...Array(60).keys()])}</div><div class="wband"></div></div><div class="row"><button type="button" class="btn" style="flex:1;width:auto;background:#f33;color:#fff" data-tcancel="1">Отмена</button><button type="button" class="btn" style="flex:1;width:auto" data-tdone="1">Готово</button></div>`;
    const [ch,cm]=el.querySelectorAll('.wcol');let lock=true;
    ch.scrollTop=(72+hi)*44;cm.scrollTop=(180+mi)*44;mark(ch);mark(cm);setTimeout(()=>lock=false,300);
    [ch,cm].forEach(c=>c.addEventListener('wheel',ev=>{ev.preventDefault();c._a=(c._a||0)+ev.deltaY*(ev.deltaMode===1?33:1);if(Math.abs(c._a)<30)return;const st=Math.sign(c._a);c._a=0;const n=c.children.length-1,base=Date.now()-(c._wt||0)<400?c._i:Math.round(c.scrollTop/44);c._i=Math.max(0,Math.min(n,base+st));c._wt=Date.now();c.scrollTo({top:c._i*44,behavior:'smooth'})},{passive:false}));
    [ch,cm].forEach(c=>c.onscroll=()=>{const L=c===c.parentNode.children[0]?24:60;if(c.scrollTop<L*22||c.scrollTop>L*44*6.5)wrap(c,L);mark(c);if(lock)return;clearTimeout(c._t);c._t=setTimeout(()=>{
      wrap(ch,24);wrap(cm,60);
      const nv=(Math.round(ch.scrollTop/44)%24)*60+Math.round(cm.scrollTop/44)%60;
      if(tact==='s'){const d=te-ts;ts=nv;te=Math.min(ts+d,1439)}else te=nv;showT()},100)});
  };
  const openT=k=>{
    if(tact===null)bk=[ts,te];
    if(desk){$('#dpin').classList.remove('open');const p=$('#tpin');if(p.classList.contains('open')&&tact===k)return closeT();tact=k;buildW(p);p.classList.add('open')}
    else{tact=k;buildW($('#tpw'));$('#tpop').classList.add('on')}
  };
  const tclick=ev=>{const w=ev.target.closest('.wv');if(w){const c=w.parentNode;c.scrollTo({top:[...c.children].indexOf(w)*44,behavior:'smooth'});return}if(ev.target.closest('[data-tcancel]')){if(bk){ts=bk[0];te=bk[1];showT()}return closeT()}if(ev.target.closest('[data-tdone]'))closeT()};
  $('#tpin').onclick=$('#tpw').onclick=tclick;
  $('#tpop').onclick=ev=>{if(ev.target.id==='tpop')closeT()};
  $('#fS').onclick=()=>openT('s');$('#fE').onclick=()=>openT('e');
  $('#fSave').onclick=()=>{
    const n={id:id||String(Date.now()),type,person:$('#fPerson').value.trim(),date:dval,start:ts,end:te,note:$('#fNote').value.trim(),pay};
    const er=t=>$('#fErr').textContent=t;
    if(!n.person)return er('Укажите имя');if(!n.date)return er('Укажите дату');if(n.end<=n.start)return er('Конец должен быть позже начала');
    const c=S.ev.find(x=>x.id!==n.id&&x.date===n.date&&x.start<n.end&&n.start<x.end);
    if(c)return er(`Студия занята: ${c.person}, ${hm(c.start)}–${hm(c.end)}`);
    if(pay==='sub'&&stat(key(n.person),n.id).left<=0)return er('В абонементе не осталось занятий');
    if(!S.stu.some(x=>key(x.name)===key(n.person)))S.stu.push({id:n.id,name:n.person});
    S.ev=S.ev.filter(x=>x.id!==n.id);S.ev.push(n);save();cur=pd(n.date);closeAll();render();
  };
}

/* zoom */
function setZoom(nh,fy){
  nh=Math.min(140,Math.max(28,nh));if(nh===H)return;
  const m=$('#main'),c=$('.cal');
  if(!c){H=nh;document.documentElement.style.setProperty('--h',H+'px');return}
  const off=c.offsetTop,t=(m.scrollTop+fy-off)/H;
  H=nh;document.documentElement.style.setProperty('--h',H+'px');
  $$('.ev').forEach(el=>{const e=S.ev.find(x=>x.id===el.dataset.id);if(!e)return;el.style.top=(e.start-S0*60)/60*H+'px';el.style.height=Math.max((e.end-e.start)/60*H-2,22)+'px'});
  const n=$('.now');if(n){const d=new Date();n.style.top=(d.getHours()*60+d.getMinutes()-S0*60)/60*H+'px'}
  m.scrollTop=t*H+off-fy;
}
let pinch=null;

/* events */
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  let b;
  if(q('[data-menu]')){closeAll();openDrawer();return}
  if(q('.xbtn')){closeAll();return}
  if(b=q('[data-stu]')){stuK=b.dataset.stu;fullNext=true;return sheet(stuHtml())}
  if(q('[data-addstu]')){tallNext=true;return sheet('<h3>Новый ученик</h3><label>Имя</label><input id="newStu" placeholder="Имя ученика"><button class="btn" id="saveStu">Добавить</button>')}
  if(q('#saveStu')){const n=$('#newStu').value.trim();if(n&&!allStu().some(a=>a[0]===key(n)))S.stu.push({id:String(Date.now()),name:n});save();closeAll();return render()}
  if(q('[data-addsub]')){const n=+$('#subN').value,u=+$('#subP').value||0;if(n>0){S.subs.push({id:String(Date.now()),k:stuK,total:n,unit:u,price:n*u,date:iso(new Date())});save();$('#sheetBody').innerHTML=stuHtml();render()}return}
  if(b=q('[data-ap]')){an.per=b.dataset.ap;$('#sheetBody').innerHTML=anHtml();return}
  if(b=q('[data-ao]')){const o=+b.dataset.ao;if(an.per==='y')an.y+=o;else{const d=new Date(an.y,an.m+o,1);an.y=d.getFullYear();an.m=d.getMonth()}$('#sheetBody').innerHTML=anHtml();return}
  if(q('#pgClose')){page='cal';first=true;return render()}
  if(b=q('[data-z]')){setZoom(H*(b.dataset.z>0?1.25:0.8),$('#main').clientHeight/2);S.zoom=Math.round(H*100)/100;save();return}
  if(b=q('.ev,.mev'))return detail(b.dataset.id);
  if(!q('#vw'))$('#vmenu').classList.remove('on');
  if(q('#vbtn')){$('#vmenu').classList.toggle('on');return}
  if(b=q('[data-vm]')){const v=b.dataset.vm;if(v==='m')view='month';else{nd=+v;view=nd===1?'day':'week'}$('#vmenu').classList.remove('on');first=true;return render()}
  if(b=q('[data-nav2]')){const s=+b.dataset.nav2;cur=view==='month'?new Date(cur.getFullYear(),cur.getMonth()+s,1):addD(cur,s*(view==='week'?nd:1));return render()}
  if(b=q('[data-go]')){cur=pd(b.dataset.go);view='day';nd=1;first=true;return render()}
  if(b=q('.mc')){cur=pd(b.dataset.date);view='day';nd=1;first=true;return render()}
  if(b=q('[data-pay]')){const x=S.ev.find(v=>v.id===b.dataset.pay);x.paid=!x.paid;save();closeAll();render();return}
  if(b=q('[data-edit]'))return form(b.dataset.edit);
  if(b=q('[data-del]')){if(confirm('Удалить запись?')){S.ev=S.ev.filter(v=>v.id!==b.dataset.del);save();closeAll();render()}return}
  if(b=q('[data-d]')){cur=pd(b.dataset.d);return render()}
  if(b=q('[data-nav]')){cur=addD(cur,+b.dataset.nav);return render()}
  if(b=q('[data-f]')){filt=b.dataset.f;return render()}
  if(b=q('[data-page]')){if(b.dataset.page==='set'){closeAll();return settings()}if(b.dataset.page==='rep'){closeAll();return analytics()}page=b.dataset.page;closeAll();return render()}
  if(b=q('#themeSeg button')){S.theme=b.dataset.t;save();return applyTheme()}
  if(b=q('.col')){const r=b.getBoundingClientRect(),m=Math.floor((e.clientY-r.top)/H*4)/4*60+S0*60;return form(null,{date:b.dataset.date,start:m,end:m+60})}
  if(q('#saveSet')){S.rate={rec:+$('#r1').value||0,lesson:+$('#r2').value||0};save();return alert('Сохранено')}
  if(q('#saveName')){S.name=$('#setName').value.trim();save();accUpd();const bt=$('#saveName');bt.textContent='Сохранено ✓';setTimeout(()=>{bt.textContent='Сохранить'},1500);return}
  if(q('#exp')){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='studio-backup.json';a.click();return}
  if(q('#clr')){if(confirm('Удалить все записи?')){S.ev=[];save();closeAll();render()}return}
});
$('#menuBtn').onclick=openDrawer;$('#scrim').onclick=closeAll;$('#dpop').onclick=e=>{if(e.target.id==='dpop')$('#dpop').classList.remove('on')};

$('#todayBtn').onclick=()=>{cur=new Date();render()};


/* swipes */
let sx,sy,edge=false,inDrawer=false,axis=null,inCal=false,st0=0;
document.addEventListener('touchstart',e=>{
  if(e.touches.length===2){if(page==='cal'&&view!=='month'&&!$('#drawer').classList.contains('on')&&!$('#sheet').classList.contains('on')){const a=e.touches[0],b=e.touches[1];pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,H0:H};axis='p';$('#main').style.overflowY=''}return}
  const t=e.touches[0];sx=t.clientX;sy=t.clientY;edge=sx<22;inDrawer=!!e.target.closest('#drawer');
  axis=null;st0=$('#main').scrollTop;inCal=page==='cal'&&!!e.target.closest('#main,#strip')&&!$('#drawer').classList.contains('on')&&!$('#sheet').classList.contains('on')&&!edge},{passive:true});
document.addEventListener('touchmove',e=>{
  if(pinch){if(e.touches.length<2)return;if(e.cancelable)e.preventDefault();const a=e.touches[0],b=e.touches[1];setZoom(pinch.H0*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d0,(a.clientY+b.clientY)/2-$('#main').getBoundingClientRect().top);return}
  if(!inCal||axis==='v')return;
  const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(!axis){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2)axis='h';else if(Math.abs(dy)>8)axis='v';else return}
  if(axis==='h'){if(e.cancelable)e.preventDefault();const m=$('#main');m.style.overflowY='hidden';m.scrollTop=st0}
},{passive:false});
const unlockY=()=>{$('#main').style.overflowY='';axis=null};
document.addEventListener('touchcancel',()=>{if(pinch){S.zoom=Math.round(H*100)/100;save();pinch=null}unlockY()},{passive:true});
document.addEventListener('touchend',e=>{if(pinch){if(!pinch.s){pinch.s=1;S.zoom=Math.round(H*100)/100;save()}if(!e.touches.length){pinch=null;unlockY()}return}unlockY();const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*.7)return;
  if(edge&&dx>0)return openDrawer();
  if(inDrawer&&dx<0)return closeAll();
  if(dx>0&&$('#sheet').classList.contains('on'))return;
  if(page==='cal'&&e.target.closest('#main,#strip')&&!$('#drawer').classList.contains('on')&&!$('#sheet').classList.contains('on')){cur=addD(cur,(dx<0?1:-1)*(view==='week'?nd:1));render()}
},{passive:true});
let sy2;$('#sheet').addEventListener('touchstart',e=>sy2=e.touches[0].clientY,{passive:true});
$('#sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy2>90&&$('#sheet').scrollTop===0)closeAll()},{passive:true});

  try{
    const i=mk(180),l=document.createElement('link');l.rel='apple-touch-icon';l.href=i;document.head.appendChild(l);
    const m={name:'Студия — календарь',short_name:'Студия',display:'standalone',start_url:location.href,background_color:'#ffffff',theme_color:'#ffcc00',icons:[{src:mk(192),sizes:'192x192',type:'image/png'},{src:mk(512),sizes:'512x512',type:'image/png'}]};
    const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k);
  }catch(e){}
})();

};
